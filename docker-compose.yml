services:
  db:
    image: postgres:16
    container_name: servicedirectory-db
    environment:
      POSTGRES_DB: ${DB_NAME:-servicedirectory}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-servicedirectory}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: